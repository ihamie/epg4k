name: Refresh mapped EPG
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'lib/**'
      - 'tests/**'
      - 'update.mjs'
      - '.github/workflows/refresh.yml'
  schedule:
    - cron: '17 13 * * *'
permissions:
  contents: write
concurrency:
  group: mapped-epg-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/guide.test.mjs
      - uses: actions/cache/restore@v4
        with:
          path: .state
          key: epg-state-${{ github.run_id }}
          restore-keys: epg-state-
      - run: node update.mjs
      - uses: actions/cache/save@v4
        with:
          path: .state
          key: epg-state-${{ github.run_id }}
      - name: Publish guide and coverage
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/guide.xml.gz docs/status.json docs/coverage.json docs/auto-mappings.json docs/source-index-errors.json
          if [ -f docs/channel-logos.json ]; then git add docs/channel-logos.json; fi
          if ! git diff --cached --quiet; then
            # Do not rebase generated files across a newer source-code or guide commit.
            # The latest push has its own queued refresh under the shared concurrency group.
            CURRENT="$(git rev-parse HEAD)"
            git fetch origin main
            if [ "$(git rev-parse origin/main)" != "$CURRENT" ]; then
              echo "Main changed during this run; skip publishing stale generated guide."
              exit 0
            fi
            git commit -m 'Refresh mapped TV schedules'
            if ! git push origin HEAD:main; then
              echo "A newer commit was published; skip this stale generated guide."
              exit 0
            fi
          fi
