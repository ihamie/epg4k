name: Refresh mapped EPG
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'lib/**'
      - 'tests/**'
      - 'update.mjs'
      - '.github/workflows/refresh.yml'
  schedule:
    - cron: '17 13 * * *'
permissions:
  contents: write
  issues: write
concurrency:
  group: mapped-epg-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/guide.test.mjs
      - uses: actions/cache/restore@v4
        with:
          path: .state
          key: epg-state-${{ github.run_id }}
          restore-keys: epg-state-
      - run: node update.mjs
      - uses: actions/cache/save@v4
        with:
          path: .state
          key: epg-state-${{ github.run_id }}
      - name: Publish guide and coverage
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/guide.xml.gz docs/status.json docs/coverage.json docs/auto-mappings.json docs/source-index-errors.json docs/sports-status.json docs/team-logos.json docs/sports-programs.json docs/quality.json docs/quality.md
          if [ -f docs/channel-logos.json ]; then git add docs/channel-logos.json; fi
          if ! git diff --cached --quiet; then
            # Do not rebase generated files across a newer source-code or guide commit.
            # The latest push has its own queued refresh under the shared concurrency group.
            CURRENT="$(git rev-parse HEAD)"
            git fetch origin main
            if [ "$(git rev-parse origin/main)" != "$CURRENT" ]; then
              echo "Main changed during this run; skip publishing stale generated guide."
              exit 0
            fi
            git commit -m 'Refresh mapped TV schedules'
            if ! git push origin HEAD:main; then
              echo "A newer commit was published; skip this stale generated guide."
              exit 0
            fi
          fi
      - name: Quality report
        if: always()
        run: |
          if [ -f docs/quality.md ]; then cat docs/quality.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Create or update refresh failure alert
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE='EPG refresh failed (automated)'
          ISSUE=$(gh issue list --state open --limit 100 --json number,title --jq '.[] | select(.title == "EPG refresh failed (automated)") | .number' | head -n 1 || true)
          URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ -n "$ISSUE" ]; then
            gh issue comment "$ISSUE" --body "The EPG workflow failed again: $URL" || true
          else
            gh issue create --title "$TITLE" --assignee "$GITHUB_REPOSITORY_OWNER" --body "An automatic EPG refresh failed. The last successfully published guide remains available. Inspect the run: $URL" || echo 'Could not create a GitHub issue. GitHub Actions failure remains visible in Actions.'
          fi
      - name: Resolve refresh failure alert after recovery
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ISSUE=$(gh issue list --state open --limit 100 --json number,title --jq '.[] | select(.title == "EPG refresh failed (automated)") | .number' | head -n 1 || true)
          if [ -n "$ISSUE" ]; then
            gh issue comment "$ISSUE" --body "The EPG refresh passed successfully in run https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}." || true
            gh issue close "$ISSUE" --reason completed || true
          fi
